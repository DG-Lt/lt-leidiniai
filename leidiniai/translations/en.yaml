configuration:
  check_time:
    name: Night check time
    description: Local time (HH:MM) of the nightly check. Only chains whose leaflet ends within 2 days (or with no leaflet yet) are checked.
  request_delay:
    name: Seconds between requests
    description: Pause between two requests to the same shop site.
  threads:
    name: Worker threads
    description: Threads used for PDF parsing and page rendering (keep 2–3, HA shares the CPU).
  chains:
    name: Chains
    description: Which chains to collect.
  browser_fallback:
    name: Headless browser fallback
    description: Use a headless Chromium when a plain request is blocked or the page needs JavaScript (Rimi always needs it).
  keep_pdf_weeks:
    name: Keep PDFs (weeks)
    description: Downloaded leaflet files older than this are deleted (offers and prices stay).
  keep_images_weeks:
    name: Keep product pictures (weeks)
    description: Product crops older than this are deleted (offers and prices stay).
  ending_soon_days:
    name: Ending soon (days)
    description: Offers ending within this many days (today included) get their end date highlighted; the "Besibaigiantys" filter shows only them. 0 = off.
  log_level:
    name: Log level
  picture_reader:
    name: Picture reader
    description: "Reads leaflets printed as pictures only (Šilas, Vynoteka drinks leaflet, some Rimi catalogues). none – they wait; tesseract – light local OCR (~25 MB, misses stylised prices); ollama – vision model Qwen2.5-VL (best; on this box ~6 GB disk and ~8–10 GB RAM while reading at night, or on another PC with Ollama URL). Selecting downloads what is needed, switching away deletes it."
  ollama_url:
    name: Ollama URL (optional)
    description: "An Ollama on another computer, e.g. http://192.168.1.20:11434. The model must already be pulled there (ollama pull qwen2.5vl:7b). Empty – Ollama is installed and run on this box."
  ollama_model:
    name: Ollama model
    description: Vision model name, e.g. qwen2.5vl:7b (default) or qwen2.5vl:3b (smaller, ~3 GB, more misreads).
