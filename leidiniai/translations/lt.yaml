configuration:
  check_time:
    name: Nakties tikrinimo laikas
    description: Vietinis laikas (HH:MM). Tikrinami tik tie tinklai, kurių leidinys baigiasi per 2 dienas (arba dar neturimas).
  request_delay:
    name: Pauzė tarp užklausų (s)
    description: Pauzė tarp dviejų užklausų į tą pačią parduotuvės svetainę.
  threads:
    name: Gijų skaičius
    description: Gijos PDF apdorojimui ir puslapių piešimui (2–3, HA dalinasi procesoriumi).
  chains:
    name: Tinklai
    description: Kuriuos tinklus rinkti.
  browser_fallback:
    name: Naršyklė be lango (atsarginis būdas)
    description: Naudoti Chromium be lango, kai paprasta užklausa blokuojama arba puslapiui reikia JavaScript (Rimi – visada).
  keep_pdf_weeks:
    name: Laikyti PDF (savaitės)
    description: Senesni leidinių failai ištrinami (pasiūlymai ir kainos lieka).
  keep_images_weeks:
    name: Laikyti prekių nuotraukas (savaitės)
    description: Senesnės nuotraukų iškarpos ištrinamos (pasiūlymai ir kainos lieka).
  log_level:
    name: Žurnalo lygis
  picture_reader:
    name: Paveikslėlių skaitytuvas
    description: "Skaito tik paveikslėliais išleistus leidinius (Šilas, Vynoteka gėrimų leidinys, kai kurie Rimi katalogai). none – jie laukia; tesseract – lengvas vietinis OCR (~25 MB, stilizuotų kainų neperskaito); ollama – vaizdo modelis Qwen2.5-VL (geriausias; šioje mašinoje ~6 GB disko ir ~8–10 GB RAM skaitant naktį, arba kitame kompiuteryje per Ollama URL). Pasirinkus atsisiunčiama, ko reikia, pakeitus – ištrinama."
  ollama_url:
    name: Ollama URL (nebūtina)
    description: "Ollama kitame kompiuteryje, pvz. http://192.168.1.20:11434. Modelis ten jau turi būti atsisiųstas (ollama pull qwen2.5vl:7b). Tuščia – Ollama įdiegiamas ir paleidžiamas šioje mašinoje."
  ollama_model:
    name: Ollama modelis
    description: Vaizdo modelio pavadinimas, pvz. qwen2.5vl:7b (numatytas) arba qwen2.5vl:3b (mažesnis, ~3 GB, daugiau klaidų).
