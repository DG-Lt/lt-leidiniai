<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Leidiniai{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ version }}">
</head>
<body>
<header>
  <b>Leidiniai</b>
  <nav>
    {% set ep = request.endpoint %}
    <a href="{{ url_for('offers.offers') }}" class="{{ 'on' if ep in ('offers.offers', 'offers.product') }}">Pasiūlymai</a>
    <a href="{{ url_for('offers.watch') }}" class="{{ 'on' if ep == 'offers.watch' }}">Stebimi</a>
    <a href="{{ url_for('ui.leaflets') }}" class="{{ 'on' if ep == 'ui.leaflets' }}">Leidiniai</a>
    <a href="{{ url_for('ui.status') }}" class="{{ 'on' if ep == 'ui.status' }}">Būsena</a>
  </nav>
</header>
<main>
{% with msgs = get_flashed_messages(with_categories=true) %}
  {% for cat, m in msgs %}<p class="{{ cat }}">{{ m }}</p>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
<script>
/* 0.8.2: open/closed state of <details data-keep="…"> sections kept per browser (Stebimi groups, Būsena sections) */
(function () {
  var store = {};
  try { store = JSON.parse(localStorage.getItem('leidiniai_open') || '{}'); } catch (e) {}
  document.querySelectorAll('details[data-keep]').forEach(function (d) {
    var k = d.getAttribute('data-keep');
    if (k in store) d.open = !!store[k];
    d.addEventListener('toggle', function () {
      store[k] = d.open;
      try { localStorage.setItem('leidiniai_open', JSON.stringify(store)); } catch (e) {}
    });
  });
})();
</script>
</body>
</html>
