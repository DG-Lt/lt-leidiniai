name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
  image:
    # Same build the Supervisor runs on "Rebuild", so a broken Dockerfile shows up here first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg BUILD_VERSION=ci -t leidiniai:ci leidiniai
      - name: Smoke test (panel answers)
        run: |
          mkdir -p /tmp/data
          docker run -d --name leidiniai-ci -e LEIDINIAI_DEV=1 -p 8099:8099 -v /tmp/data:/data leidiniai:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8099/ >/dev/null && break; sleep 2; done
          curl -fsS http://localhost:8099/ | grep -q "Pasiūlymai"
          # the parser libraries work inside the image (pdfplumber + pypdfium2 crops)
          docker cp tests/fixtures/norfa_523_p4.pdf leidiniai-ci:/tmp/norfa.pdf
          docker exec leidiniai-ci python -m leidiniai.parsers norfa /tmp/norfa.pdf | python3 -c "import json,sys; o=json.load(sys.stdin); assert len(o) == 13, len(o)"
          docker exec leidiniai-ci python -c "from pathlib import Path; from leidiniai.parsers import pdf_text as p; o=p.parse('/tmp/norfa.pdf','norfa'); assert len(p.render_crops('/tmp/norfa.pdf',o,Path('/tmp/c')))==13"
          docker logs leidiniai-ci
