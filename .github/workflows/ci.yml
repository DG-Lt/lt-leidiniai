name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
  image:
    # Same build the Supervisor runs on "Rebuild", so a broken Dockerfile shows up here first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg BUILD_VERSION=ci -t leidiniai:ci leidiniai
      - name: Smoke test (panel answers, MQTT discovery reaches a real broker)
        run: |
          mkdir -p /tmp/data
          docker network create ci
          docker run -d --name mosquitto --network ci eclipse-mosquitto:2 mosquitto -c /mosquitto-no-auth.conf
          docker run -d --name leidiniai-ci --network ci -e LEIDINIAI_DEV=1 -e LEIDINIAI_MQTT_HOST=mosquitto \
            -p 8099:8099 -v /tmp/data:/data leidiniai:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8099/ >/dev/null && break; sleep 2; done
          curl -fsS http://localhost:8099/ | grep -q "Pasiūlymai"
          # the parser libraries work inside the image (pdfplumber + pypdfium2 crops)
          docker cp tests/synthetic/norfa_synthetic.pdf leidiniai-ci:/tmp/norfa.pdf
          docker exec leidiniai-ci python -m leidiniai.parsers norfa /tmp/norfa.pdf | python3 -c "import json,sys; o=json.load(sys.stdin); assert len(o) == 6, len(o)"
          docker exec leidiniai-ci python -c "from pathlib import Path; from leidiniai.parsers import pdf_text as p; o=p.parse('/tmp/norfa.pdf','norfa'); assert len(p.render_crops('/tmp/norfa.pdf',o,Path('/tmp/c')))==6"
          sleep 3  # MQTT connects in the background
          # retained discovery + states on the broker
          docker exec mosquitto mosquitto_sub -t 'homeassistant/#' -t 'leidiniai/#' -v -W 5 --retained-only > /tmp/mqtt.txt || true
          cat /tmp/mqtt.txt
          grep -q '"default_entity_id": "sensor.leidiniai_iki_leaflet"' /tmp/mqtt.txt
          grep -q '"default_entity_id": "button.leidiniai_check_now"' /tmp/mqtt.txt
          grep -q '^leidiniai/status online' /tmp/mqtt.txt
          grep -q '^leidiniai/iki/leaflet/state nėra' /tmp/mqtt.txt
          docker exec leidiniai-ci sh -c 'grep -c "MQTT: connected" /data/logs/leidiniai.log'
          docker logs leidiniai-ci
